<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f14"/>
      <stop offset="50%" stop-color="#05130b"/>
      <stop offset="100%" stop-color="#020905"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7a8"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="480" fill="url(#bg-grad)"/>
  <circle cx="320" cy="240" r="180" fill="url(#glow)"/>

  <!-- Botanical Leaf Specimen Illustration -->
  <g transform="translate(320, 240) rotate(-25)">
    <!-- Main leaf body -->
    <path d="M 0,-140 C 90,-90 110,60 0,140 C -110,60 -90,-90 0,-140 Z" fill="url(#leaf-grad)" fill-opacity="0.85"/>
    <!-- Central leaf vein -->
    <path d="M 0,-130 Q 5,0 0,165" stroke="url(#stem-grad)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Secondary side veins -->
    <path d="M 0,-90 Q 35,-65 65,-50" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <path d="M 0,-90 Q -35,-65 -65,-50" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <path d="M 0,-40 Q 45,-15 80,0" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <path d="M 0,-40 Q -45,-15 -80,0" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <path d="M 0,15 Q 50,40 75,60" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <path d="M 0,15 Q -50,40 -75,60" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none"/>
    <path d="M 0,70 Q 40,90 55,105" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" fill="none"/>
    <path d="M 0,70 Q -40,90 -55,105" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-opacity="0.5" fill="none"/>
  </g>

  <!-- Botanical Specimen Label -->
  <text x="320" y="415" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="2" fill="#6ee7a8" fill-opacity="0.75">BOTANICAL SPECIMEN</text>
  <text x="320" y="435" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" letter-spacing="1" fill="#ffffff" fill-opacity="0.35">PHOTO ARCHIVE PENDING</text>
</svg>
